name: HF downloads badge

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/hf-downloads-badge.yml]

permissions:
  contents: write

jobs:
  badge:
    runs-on: ubuntu-latest
    steps:
      - name: Sum all-time downloads of the H-Spec checkpoints
        run: |
          set -o pipefail
          total=0
          for m in qwen3-8b qwen3-4b llama3.1-8b-it; do
            n=$(curl -sf "https://huggingface.co/api/models/weifanjiang/$m.speculators.hspec?expand%5B%5D=downloadsAllTime" | jq -e .downloadsAllTime)
            total=$((total + n))
          done
          mkdir out
          jq -n --arg msg "$total" \
            '{schemaVersion: 1, label: "downloads", message: $msg, color: "FFD21E", namedLogo: "huggingface"}' \
            > out/hf-downloads.json
          cat out/hf-downloads.json
      - name: Publish to the badges branch
        working-directory: out
        run: |
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hf-downloads.json
          git commit -qm "Update HF downloads badge"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" badges
